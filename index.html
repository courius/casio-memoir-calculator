<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="utf-8"> 
    <title>Simple Calculator</title> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(91, 97, 107);
        }

        .calc {
            position: relative;
            display: flex;
            flex-direction: column;
            background-image: url(calculatorBack.png);
            background-repeat: no-repeat;
            background-size:cover;
            max-width: 360.49px;
            width: 100%;
            aspect-ratio: 370.49 / 850.44;
            overflow: hidden;
            border-radius: 39px;
            padding: 16px;
        }

        .input_fields {
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }

        .input_fields input {
            background-color: transparent;
            border: none;
            font-family: Orbitron;
            font-size: 35px;
            padding: 10px;
            width: 308px;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .calc button:hover {
            background-color: #4e4c4c;
        }

        .resultArea {
            display: flex;
            justify-content: end;
        }

        #result {
            font-family: Orbitron;
            color: rgb(22, 22, 22);
            font-size: 25px;
            margin-top: 30px;
            margin-right: 25px;
        }

        .keyboard_grid {
            margin-top: 280px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(4, 60px);
            grid-gap: 10px;
            padding: 10px;
        }

        .keyboard_grid button {
            font-weight: bolder;
            width: 100%;
            font-size: 25px;
            background-color: rgba(225, 220, 220, 0.96);
            cursor: pointer;
            border-radius: 10px;
            border: none;
        }

        #calculator_cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(205, 205, 207);
            z-index: 10;

            transition: transform 0.6s ease-in-out;
        }

        #calculator_cover.slid-away {
            transform: translateY(100%);
        }

    </style>
</head> 
 
<body> 
    <div class="calc">
        <img src="calcCover.png" id="calculator_cover" onclick="slideOffCover()">
        </img>

        <div class="input_fields">
            <input id="expression" type="text" readonly>
        </div>
        
        <div class="resultArea">
            <p id="result">Result: </p>
        </div>

        <div class="keyboard_grid">
            <button onclick="displayNumber(event)">7</button>
            <button onclick="displayNumber(event)">8</button>
            <button onclick="displayNumber(event)">9</button>
            <button onclick="deleteOne()" style="background-color:rgb(50, 80, 186); color: azure; font-family: Orbitron; font-weight: bold; font-size: 20px;">DEL</button>
            <button onclick="clearAll()" style="background-color:rgb(50, 80, 186); color: azure; font-family: Orbitron; font-weight: bold; font-size: 20px;">AC</button>

            <button onclick="displayNumber(event)">4</button>
            <button onclick="displayNumber(event)">5</button>
            <button onclick="displayNumber(event)">6</button>
            <button onclick="displayNumber(event)">*</button>
            <button onclick="displayNumber(event)">/</button>

            <button onclick="displayNumber(event)">1</button>
            <button onclick="displayNumber(event)">2</button>
            <button onclick="displayNumber(event)">3</button>
            <button onclick="displayNumber(event)">+</button>
            <button onclick="displayNumber(event)">-</button>

            <button onclick="displayNumber(event)">0</button>
            <button onclick="displayNumber(event)">.</button>
            <button></button>
            <button onclick="lastResultANS()" style="font-size: 20px;">Ans</button>
            <button onclick="displayResult()">=</button>
        </div>
    </div> 
    

    <script>
        let lastResult = [];
        let resultDisplayed = false;

        function slideOffCover() {
            let cover = document.getElementById("calculator_cover");

            cover.classList.add("slid-away");

            setTimeout(() => {
                cover.style.display = "none";
            }, 600);
        }

        function getCalculatorArray() {
            let calculatorArray = document.getElementById("expression").value.split(/(?=[+\-*/])|(?<=[+\-*/])/);

            return calculatorArray;
        }

        function getCharacterNumbers() {
            let charactersArray = document.getElementById("expression").value.split('');

            return charactersArray;
        }

        function checkResultDisplayed() {
            if (resultDisplayed == true) {
                document.getElementById("expression").value = "";
                resultDisplayed = false;
            }
        }

        function displayNumber(event) {
            let inputField = document.getElementById("expression");
            let oldText = inputField.value;


            let currentArray = getCharacterNumbers();
            console.log(currentArray);
            checkResultDisplayed();

            if (currentArray.length < 10) {
                if (getCalculatorArray() == "" && event.target.innerText == '.') {
                    document.getElementById("expression").value += '0.';
                } else {
                    document.getElementById("expression").value += event.target.innerText;
                }
            }
        }

        function calculateArray(array) {
            while (array.includes('*') || array.includes('/')) {

                let multiplyPos = array.indexOf('*');
                let dividePos = array.indexOf('/');

                let pos;

                if (multiplyPos !== -1 && (dividePos === -1 || multiplyPos < dividePos)) {
                    pos = multiplyPos;
                } else {
                    pos = dividePos;
                }

                let rawBefore = array[pos - 1];
                let rawAfter = array[pos + 1];

                let operators = ['+', '-', '*', '/']

                if (operators.includes(rawBefore) || operators.includes(rawAfter) || !rawBefore || !rawAfter) {
                    document.getElementById("expression").value = 'MATH ERROR';
                    return;
                }

                let before = parseFloat(array[pos - 1]);
                let after = parseFloat(array[pos + 1]);

                let result;

                if (array[pos] == '*') {
                    result = before * after;
                } else {
                    result = before / after;
                }

                array.splice(pos - 1, 3, result);
                
            }

            while (array.includes('+') || array.includes('-')) {

                let sumPos = array.indexOf('+');
                let subtPos = array.indexOf('-');

                let pos;

                if (sumPos !== -1 && (subtPos === -1 || sumPos < subtPos)) {
                    pos = sumPos;
                } else {
                    pos = subtPos;
                }

                let before = parseFloat(array[pos - 1]);
                let after = parseFloat(array[pos + 1]);

                let result;

                if (array[pos] == '+') {
                    result = before + after;
                } else {
                    result = before - after;
                }

                array.splice(pos - 1, 3, result);
            }

            lastResult = array

            return array;
        }
        
        function displayResult() {
            document.getElementById("result").textContent = calculateArray(getCalculatorArray())[0];
            resultDisplayed = true;
        }

        function clearAll() {
            document.getElementById("expression").value = "";
        }

        function deleteOne() {
            let updatedExpression = document.getElementById("expression").value.slice(0, -1);
            document.getElementById("expression").value = updatedExpression;
        }

        function lastResultANS() {
            clearAll();
            document.getElementById("expression").value += lastResult;
        }

    </script>
</body> 
</html>
